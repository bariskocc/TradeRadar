{% extends "base.html" %}

{% block title %}TradeRadar - Charts{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
    .ch-grid { display: grid; gap: 8px; }
    .ch-cell { display: flex; flex-direction: column; min-width: 0; }
    .ch-body { flex: 1; min-height: 0; position: relative; }
    .ch-tf { padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; color: rgb(var(--tr-g500)); }
    .ch-tf:hover { background: rgb(var(--tr-g500) / 0.12); color: rgb(var(--tr-fg)); }
    .ch-tf.on { background: #3b82f6; color: #fff; }
    .ch-lay { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; color: rgb(var(--tr-g500)); background: rgb(var(--tr-g500) / 0.08); }
    .ch-lay:hover { color: rgb(var(--tr-fg)); }
    .ch-lay.on { background: #3b82f6; color: #fff; }
    .ch-sel { background: transparent; color: rgb(var(--tr-fg)); font-size: 12px; font-weight: 600; border: 0; outline: none; max-width: 130px; }
    .ch-sel option, .ch-sel optgroup { background: rgb(var(--tr-d800)); color: rgb(var(--tr-fg)); }
    .ch-switch { position: relative; width: 34px; height: 18px; border-radius: 9px; background: rgb(var(--tr-g700)); transition: background .15s; flex: none; }
    .ch-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
    .ch-switch.on { background: #22c55e; }
    .ch-switch.on::after { left: 18px; }
    /* Son fiyat etiketinin altinda mum kapanisina kalan sure (TradingView'daki gibi) */
    .ch-cd { position: absolute; right: 0; z-index: 3; display: none; pointer-events: none; text-align: center;
             font-size: 11px; line-height: 16px; color: #fff; font-variant-numeric: tabular-nums; border-radius: 0 0 2px 2px; }
    .ch-legend { position: absolute; top: 6px; left: 8px; z-index: 3; font-size: 11px; color: rgb(var(--tr-g500)); pointer-events: none; font-variant-numeric: tabular-nums; }
    /* Cizim araclari (01.11): yalniz masaustu, cizimler tarayicida (localStorage) */
    .ch-draw { display: none; align-items: center; gap: 4px; }
    @media (min-width: 768px) { .ch-draw { display: flex; } }
    .ch-sw { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; }
    .ch-sw.on { border-color: rgb(var(--tr-fg)); }
    .ch-clr { font-size: 10px; color: rgb(var(--tr-g500)); padding: 1px 5px; border-radius: 5px; display: none; white-space: nowrap; }
    .ch-clr:hover { color: #ef4444; background: rgb(var(--tr-g500) / 0.12); }
    @media (max-width: 767px) {
        .ch-grid { grid-template-columns: 1fr !important; }
        /* sidebar.html telefonda butun main tablolarina dolgu + yapiskan ilk sutun veriyor; grafik
           kutuphanesi de icini <table> ile ciziyor -> grafik kutusundan tasip saat ekseni kesiliyordu */
        main .ch-canvas table td, main .ch-canvas table th,
        main .ch-canvas table td:first-child, main .ch-canvas table th:first-child {
            padding: 0 !important; position: static !important; background: none !important;
            box-shadow: none !important; z-index: auto !important; }
    }
</style>
{% endblock %}

{% block body %}
<div class="flex h-full">

    {% set active_page = 'charts' %}
    {% include 'sidebar.html' %}

    <main class="flex-1 overflow-auto">
        <div class="p-3 md:p-4 max-w-none">
            <div class="mb-3 flex flex-wrap items-center gap-x-4 gap-y-2">
                <h1 class="text-xl font-bold text-white mr-2">Charts</h1>
                <div class="flex items-center gap-1" id="layouts">
                    {% for n in [1, 2, 4, 6, 9] %}
                    <button type="button" class="ch-lay" data-n="{{ n }}">{{ n }}</button>
                    {% endfor %}
                </div>
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <span id="sig-switch" class="ch-switch" role="switch" aria-checked="false" tabindex="0"></span>
                    <span class="text-xs text-gray-400">Signals</span>
                </label>
                <div class="ch-draw" id="draw-bar">
                    <button type="button" class="ch-lay" data-tool="cursor" title="Select / move (Esc)">Cursor</button>
                    <button type="button" class="ch-lay" data-tool="h" title="Horizontal line: click once">H-Line</button>
                    <button type="button" class="ch-lay" data-tool="t" title="Trend line: click two points (or drag)">Trend</button>
                    <button type="button" class="ch-lay" data-tool="r" title="Box: click two corners (or drag)">Box</button>
                    <span class="mx-1 flex items-center gap-1" id="draw-colors"></span>
                    <button type="button" class="ch-lay" id="draw-del" title="Delete selected drawing (Del)">Delete</button>
                </div>
                <span class="text-[11px] text-gray-500">Candles in TSİ · live from the bot's feed</span>
            </div>

            <div id="grid" class="ch-grid"></div>
        </div>
    </main>
</div>

<template id="cell-tpl">
    <div class="ch-cell bg-dark-800 rounded-xl border border-dark-600 overflow-hidden">
        <div class="flex items-center gap-2 px-2 py-1.5 border-b border-dark-600">
            <select class="ch-sel">
                {% for group, syms in symbol_groups %}
                <optgroup label="{{ group }}">
                    {% for sym, label in syms %}<option value="{{ sym }}">{{ label }}</option>{% endfor %}
                </optgroup>
                {% endfor %}
            </select>
            <div class="flex items-center gap-0.5 ch-tfs">
                <button type="button" class="ch-tf" data-tf="15m">15m</button>
                <button type="button" class="ch-tf" data-tf="1h">1H</button>
                <button type="button" class="ch-tf" data-tf="4h">4H</button>
                <button type="button" class="ch-tf" data-tf="1d">1D</button>
                <button type="button" class="ch-tf" data-tf="1w">1W</button>
            </div>
            <div class="ml-auto flex items-center gap-2 min-w-0">
                <button type="button" class="ch-clr" title="Delete all drawings on this symbol"></button>
                <span class="ch-info text-[10px] text-gray-500 truncate"></span>
            </div>
        </div>
        <div class="ch-body">
            <div class="ch-legend"></div>
            <div class="ch-cd"></div>
            <div class="ch-canvas" style="position:absolute; inset:0;"></div>
        </div>
    </div>
</template>

<script>
(function () {
    const STORE_KEY = 'tr-charts';
    const DEFAULTS = ['BTCUSDT.P', 'ETHUSDT.P', 'XAUUSD', 'US100', 'EURUSD', 'SOLUSDT.P', 'GBPUSD', 'XAGUSD', 'USDJPY'];
    const COLS = { 1: 1, 2: 2, 4: 2, 6: 3, 9: 3 };
    const REFRESH_MS = 15000;
    const SIGNAL_REFRESH_MS = 60000;
    // Izgara/eksen cizgisi temaya gore (24.10); tema degisince sayfa yeniden cizilir (secimler localStorage'da)
    const LINE = (a) => trDark() ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`;
    window.addEventListener('tr-theme', () => location.reload());
    const C = { up: '#22c55e', down: '#ef4444', entry: '#3b82f6', sl: '#ef4444', tp: '#22c55e', be: '#9ca3af' };

    const grid = document.getElementById('grid');
    const tpl = document.getElementById('cell-tpl');
    const sw = document.getElementById('sig-switch');
    const validSymbols = new Set(Array.from(tpl.content.querySelectorAll('option')).map(o => o.value));

    // ── durum (tarayicida; yalniz kolaylik, okunamazsa varsayilan) ──
    let state = { layout: 4, signals: true, cells: [] };
    try {
        const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
        if (s && typeof s === 'object') state = Object.assign(state, s);
    } catch (e) { /* yok say */ }
    function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* yok say */ } }
    function cellConf(i) {
        let c = state.cells[i];
        if (!c || !validSymbols.has(c.symbol)) {
            const sym = DEFAULTS.find(s => validSymbols.has(s) && !state.cells.some(x => x && x.symbol === s)) || DEFAULTS[0];
            c = { symbol: sym, tf: (c && c.tf) || '4h' };
            state.cells[i] = c;
        }
        return c;
    }

    let cells = [];

    // ── yardimcilar ──
    function fmt(v, p) { return v == null ? '-' : Number(v).toFixed(p); }
    function snap(times, t) {
        // t'yi icine dusen mumun zamanina oturt (marker/segment mum disi zaman eklemesin)
        if (t == null || !times.length || t < times[0]) return null;
        let lo = 0, hi = times.length - 1;
        while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (times[mid] <= t) lo = mid; else hi = mid - 1; }
        return times[lo];
    }

    function makeCell(i, h) {
        const conf = cellConf(i);
        const el = tpl.content.firstElementChild.cloneNode(true);
        el.style.height = h + 'px';   // grafik olusmadan once: boyutu ilk olcumde dogru alsin
        grid.appendChild(el);
        const sel = el.querySelector('.ch-sel');
        const info = el.querySelector('.ch-info');
        const legend = el.querySelector('.ch-legend');
        sel.value = conf.symbol;

        const chart = LightweightCharts.createChart(el.querySelector('.ch-canvas'), {
            autoSize: true,
            layout: { background: { color: 'transparent' }, textColor: trDark() ? '#9ca3af' : '#6b7280', fontSize: 11 },
            grid: { vertLines: { color: LINE(0.05) }, horzLines: { color: LINE(0.05) } },
            rightPriceScale: { borderColor: LINE(0.12) },
            timeScale: { borderColor: LINE(0.12), timeVisible: true, secondsVisible: false, rightOffset: 5 },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        });
        const series = chart.addCandlestickSeries({
            upColor: C.up, downColor: C.down, wickUpColor: C.up, wickDownColor: C.down, borderVisible: false,
        });
        const cell = { i, el, chart, series, sel, info, legend, cd: el.querySelector('.ch-cd'),
                       lastBar: null, barClose: null, expired: null, gen: 0, times: [], history: null,
                       precision: 2, priceLines: [], segs: [], signals: [] };

        chart.subscribeCrosshairMove(p => {
            const d = p && p.seriesData ? p.seriesData.get(series) : null;
            if (!d) { legend.textContent = ''; return; }
            const pr = cell.precision;
            legend.textContent = `O ${fmt(d.open, pr)}  H ${fmt(d.high, pr)}  L ${fmt(d.low, pr)}  C ${fmt(d.close, pr)}`;
        });

        chart.timeScale().subscribeVisibleLogicalRangeChange(() => tickCell(cell));

        sel.addEventListener('change', () => { conf.symbol = sel.value; save(); refreshClr(cell); load(cell, true); });
        el.querySelectorAll('.ch-tf').forEach(b => {
            b.classList.toggle('on', b.dataset.tf === conf.tf);
            b.addEventListener('click', () => {
                conf.tf = b.dataset.tf; save();
                el.querySelectorAll('.ch-tf').forEach(x => x.classList.toggle('on', x === b));
                load(cell, true);
            });
        });
        cell.conf = conf;
        attachDrawing(cell);
        return cell;
    }

    async function load(cell, full) {
        const conf = cell.conf;
        const gen = full ? ++cell.gen : cell.gen;
        const last = cell.times.length ? cell.times[cell.times.length - 1] : null;
        let url = `/api/charts/candles?symbol=${encodeURIComponent(conf.symbol)}&tf=${conf.tf}`;
        const incremental = !full && last != null && cell.history !== 'pending';
        if (incremental) url += `&since=${last}`;
        if (full) { cell.info.textContent = 'loading…'; clearSignals(cell); }
        let data;
        try {
            const r = await fetch(url);
            if (r.status === 401) { location.href = '/login'; return; }
            data = await r.json();
            if (!r.ok) { cell.info.textContent = data.error || 'error'; return; }
        } catch (e) { if (full) cell.info.textContent = 'load failed'; return; }
        if (gen !== cell.gen) return;   // bu arada sembol/TF degisti

        if (incremental) {
            for (const c of data.candles) {
                try { cell.series.update(c); } catch (e) { /* eski mum: yok say */ }
                if (c.time > cell.times[cell.times.length - 1]) cell.times.push(c.time);
            }
            if (data.candles.length) cell.lastBar = data.candles[data.candles.length - 1];
        } else {
            cell.lastBar = data.candles.length ? data.candles[data.candles.length - 1] : null;
            cell.precision = data.precision;
            cell.series.applyOptions({ priceFormat: { type: 'price', precision: data.precision, minMove: Math.pow(10, -data.precision) } });
            cell.series.setData(data.candles);
            cell.times = data.candles.map(c => c.time);
            cell.layer.update();
            const n = cell.times.length;
            if (full && n) cell.chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - 150), to: n + 5 });
        }
        cell.barClose = data.bar_close;
        tickCell(cell);
        const prevHistory = cell.history;
        cell.history = data.history;
        const note = { pending: ' · history after startup', failed: ' · history unavailable', store: '' }[data.history] || '';
        cell.info.textContent = cell.times.length ? `${cell.times.length} bars${note}` : `no data${note}`;
        if (full || prevHistory === 'pending') loadSignals(cell);
    }

    // ── mum kapanisina geri sayim ──
    function fmtLeft(sec) {
        const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
        const p = v => String(v).padStart(2, '0');
        if (d > 0) return `${d}d ${p(h)}h`;
        return h > 0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
    }
    function tickCell(cell) {
        const cd = cell.cd, b = cell.lastBar;
        const left = cell.barClose == null ? -1 : Math.floor(cell.barClose - Date.now() / 1000);
        if (!b || left <= 0) {
            cd.style.display = 'none';
            // Mum bitti: yenisini 15 sn beklemeden iste (bar basina bir kez)
            if (b && cell.barClose != null && cell.expired !== cell.barClose && left > -60) {
                cell.expired = cell.barClose; setTimeout(() => load(cell, false), 1500);
            }
            return;
        }
        const y = cell.series.priceToCoordinate(b.close);
        const paneH = cell.el.querySelector('.ch-body').clientHeight - cell.chart.timeScale().height();
        if (y == null || y < 0 || y + 26 > paneH) { cd.style.display = 'none'; return; }
        cd.textContent = fmtLeft(left);
        cd.style.top = Math.round(y + 9) + 'px';
        cd.style.width = cell.chart.priceScale('right').width() + 'px';
        cd.style.background = b.close >= b.open ? C.up : C.down;
        cd.style.display = 'block';
    }
    setInterval(() => { if (!document.hidden) cells.forEach(tickCell); }, 1000);

    // ── sinyal katmani ──
    function clearSignals(cell) {
        cell.priceLines.forEach(l => { try { cell.series.removePriceLine(l); } catch (e) {} });
        cell.segs.forEach(s => { try { cell.chart.removeSeries(s); } catch (e) {} });
        cell.priceLines = []; cell.segs = [];
        cell.series.setMarkers([]);
    }

    async function loadSignals(cell) {
        if (!state.signals) { clearSignals(cell); return; }
        const gen = cell.gen;
        let data;
        try {
            const r = await fetch(`/api/charts/signals?symbol=${encodeURIComponent(cell.conf.symbol)}`);
            if (!r.ok) return;
            data = await r.json();
        } catch (e) { return; }
        if (gen !== cell.gen || !state.signals) return;
        cell.signals = data.signals || [];
        drawSignals(cell);
    }

    function segment(cell, t0, t1, price, color, style) {
        if (t0 == null || t1 == null || price == null) return;
        const s = cell.chart.addLineSeries({
            color, lineWidth: 1, lineStyle: style, priceLineVisible: false, lastValueVisible: false,
            crosshairMarkerVisible: false, priceFormat: { type: 'price', precision: cell.precision, minMove: Math.pow(10, -cell.precision) },
        });
        s.setData(t1 > t0 ? [{ time: t0, value: price }, { time: t1, value: price }] : [{ time: t0, value: price }]);
        cell.segs.push(s);
    }

    function drawSignals(cell) {
        clearSignals(cell);
        if (!state.signals || !cell.times.length) return;
        const times = cell.times, lastT = times[times.length - 1];
        const markers = [];
        const L = LightweightCharts.LineStyle;
        for (const s of cell.signals) {
            const tag = `#${s.id} ${s.tf_label}`;
            const long = s.direction === 'LONG';
            if (s.open) {
                const add = (price, color, title, style) => price != null && cell.priceLines.push(cell.series.createPriceLine({
                    price, color, lineWidth: 1, lineStyle: style, axisLabelVisible: true, title,
                }));
                add(s.entry, C.entry, `${tag} ${s.status === 'active' ? 'Entry' : 'Limit'}`, s.status === 'active' ? L.Solid : L.Dashed);
                add(s.sl, C.sl, `${tag} SL`, L.Solid);
                if (s.sl_now != null && s.sl != null && Math.abs(s.sl_now - s.sl) > 1e-12) add(s.sl_now, C.be, `${tag} SL now`, L.Dashed);
                add(s.tp, C.tp, `${tag} TP`, L.Solid);
                const ft = snap(times, s.filled);
                if (ft != null) markers.push({ time: ft, position: long ? 'belowBar' : 'aboveBar', color: long ? C.up : C.down,
                                               shape: long ? 'arrowUp' : 'arrowDown', text: tag });
                continue;
            }
            // Kapanan islem: dolumdan kapanisa kisa cizgiler + giris/cikis isaretleri
            const t0 = snap(times, s.filled), t1 = snap(times, s.closed);
            if (t0 == null) continue;
            const end = t1 != null ? t1 : lastT;
            segment(cell, t0, end, s.entry, C.entry, L.Solid);
            segment(cell, t0, end, s.sl, C.sl, L.Dotted);
            segment(cell, t0, end, s.tp, C.tp, L.Dotted);
            markers.push({ time: t0, position: long ? 'belowBar' : 'aboveBar', color: long ? C.up : C.down,
                           shape: long ? 'arrowUp' : 'arrowDown', text: tag });
            if (t1 != null) {
                const col = s.outcome === 'win' ? C.up : s.outcome === 'loss' ? C.down : C.be;
                const rr = s.rr == null ? s.outcome || '' : `${s.rr >= 0 ? '+' : ''}${s.rr.toFixed(2)}R`;
                markers.push({ time: t1, position: long ? 'aboveBar' : 'belowBar', color: col, shape: 'circle', text: rr });
            }
        }
        markers.sort((a, b) => a.time - b.time);
        cell.series.setMarkers(markers);
    }

    // ── cizimler (01.11): yatay cizgi / trend / kutu; sembole bagli, TF'den bagimsiz (zaman + fiyat) ──
    // Yalniz masaustu; kayit tarayicida. Nokta = {t: unix sn, p: fiyat}; TF degisince zaman mum
    // indeksine (kesirli) cevrilir, boylece 15m'de cizilen kutu 4H'te de ayni yerde durur.
    const DRAW_KEY = 'tr-charts-draw';
    const DCOLORS = ['#3b82f6', '#f59e0b', '#a855f7', '#ef4444', '#22c55e', '#9ca3af'];
    const BAR_SEC = { '15m': 900, '1h': 3600, '4h': 14400, '1d': 86400, '1w': 604800 };
    const HIT_PX = 6;
    let drawings = {};
    try {
        const d = JSON.parse(localStorage.getItem(DRAW_KEY) || 'null');
        if (d && typeof d === 'object') drawings = d;
    } catch (e) { /* yok say */ }
    const draw = { tool: 'cursor', color: DCOLORS[0], selected: null, pending: null, drag: null };
    function saveDrawings() { try { localStorage.setItem(DRAW_KEY, JSON.stringify(drawings)); } catch (e) { /* yok say */ } }
    function listFor(sym) { return drawings[sym] || []; }
    function redrawSymbol(sym) {
        cells.forEach(c => { if (c.conf.symbol === sym) { c.layer.update(); refreshClr(c); } });
    }

    // zaman <-> mantiksal indeks (bosluklu seride mum suresiyle sinirli ara deger)
    function timeToLogical(cell, t) {
        const ts = cell.times, n = ts.length, bs = BAR_SEC[cell.conf.tf] || 3600;
        if (!n) return null;
        if (t <= ts[0]) return (t - ts[0]) / bs;
        if (t >= ts[n - 1]) return n - 1 + (t - ts[n - 1]) / bs;
        let lo = 0, hi = n - 1;
        while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ts[mid] <= t) lo = mid; else hi = mid - 1; }
        return lo + Math.min(1, (t - ts[lo]) / Math.min(bs, ts[lo + 1] - ts[lo]));
    }
    function logicalToTime(cell, l) {
        const ts = cell.times, n = ts.length, bs = BAR_SEC[cell.conf.tf] || 3600;
        if (!n || l == null) return null;
        const i = Math.floor(l);
        if (i < 0) return ts[0] + l * bs;
        if (i >= n - 1) return ts[n - 1] + (l - (n - 1)) * bs;
        return ts[i] + (l - i) * Math.min(bs, ts[i + 1] - ts[i]);
    }
    function toXY(cell, pt) {
        const l = timeToLogical(cell, pt.t);
        const x = l == null ? null : cell.chart.timeScale().logicalToCoordinate(l);
        const y = cell.series.priceToCoordinate(pt.p);
        return x == null || y == null ? null : { x, y };
    }
    // fare olayindan grafik alani koordinati; fiyat ekseni / zaman ekseni uzerindeyse inside=false
    function paneXY(cell, e) {
        const r = cell.canvasEl.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        const w = r.width - cell.chart.priceScale('right').width(), h = r.height - cell.chart.timeScale().height();
        return { x, y, inside: x >= 0 && y >= 0 && x < w && y < h };
    }
    function pointAt(cell, x, y) {
        const l = cell.chart.timeScale().coordinateToLogical(x);
        const t = logicalToTime(cell, l), p = cell.series.coordinateToPrice(y);
        return t == null || p == null ? null : { t, p };
    }

    function geom(cell, d) {
        if (d.type === 'h') {
            const y = cell.series.priceToCoordinate(d.a.p);
            return y == null ? null : { y };
        }
        const a = toXY(cell, d.a), b = toXY(cell, d.b);
        return a && b ? { x1: a.x, y1: a.y, x2: b.x, y2: b.y } : null;
    }
    function segDist(px, py, g) {
        const dx = g.x2 - g.x1, dy = g.y2 - g.y1, len2 = dx * dx + dy * dy;
        const k = len2 ? Math.max(0, Math.min(1, ((px - g.x1) * dx + (py - g.y1) * dy) / len2)) : 0;
        return Math.hypot(px - (g.x1 + k * dx), py - (g.y1 + k * dy));
    }
    // ustteki cizimden baslayarak: {d, part}; part = body | a | b | ab (kutu: t a'dan, p b'den) | ba
    function hitTest(cell, x, y) {
        const list = listFor(cell.conf.symbol);
        for (let i = list.length - 1; i >= 0; i--) {
            const d = list[i], g = geom(cell, d);
            if (!g) continue;
            if (d.type === 'h') { if (Math.abs(y - g.y) <= HIT_PX) return { d, part: 'body' }; continue; }
            const near = (px, py) => Math.hypot(x - px, y - py) <= HIT_PX + 1;
            if (near(g.x1, g.y1)) return { d, part: 'a' };
            if (near(g.x2, g.y2)) return { d, part: 'b' };
            if (d.type === 't') { if (segDist(x, y, g) <= HIT_PX) return { d, part: 'body' }; continue; }
            if (near(g.x1, g.y2)) return { d, part: 'ab' };
            if (near(g.x2, g.y1)) return { d, part: 'ba' };
            const l = Math.min(g.x1, g.x2), r = Math.max(g.x1, g.x2), t = Math.min(g.y1, g.y2), b = Math.max(g.y1, g.y2);
            if (x >= l - HIT_PX && x <= r + HIT_PX && y >= t - HIT_PX && y <= b + HIT_PX) return { d, part: 'body' };
        }
        return null;
    }

    function hexA(hex, a) {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
    }
    function paintCell(cell, ctx, size) {
        const list = listFor(cell.conf.symbol).slice();
        const pend = draw.pending;
        if (pend && pend.sym === cell.conf.symbol) list.push(pend.d);
        const sel = draw.selected;
        for (const d of list) {
            const g = geom(cell, d);
            if (!g) continue;
            const isSel = sel && sel.d === d;
            ctx.strokeStyle = d.c; ctx.lineWidth = isSel ? 2 : 1.5;
            ctx.beginPath();
            if (d.type === 'h') {
                ctx.moveTo(0, g.y); ctx.lineTo(size.width, g.y); ctx.stroke();
                continue;
            }
            if (d.type === 't') {
                ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.x2, g.y2); ctx.stroke();
            } else {
                const x = Math.min(g.x1, g.x2), y = Math.min(g.y1, g.y2), w = Math.abs(g.x2 - g.x1), h = Math.abs(g.y2 - g.y1);
                ctx.fillStyle = hexA(d.c, 0.13); ctx.fillRect(x, y, w, h);
                ctx.rect(x, y, w, h); ctx.stroke();
            }
            if (isSel || d === (pend && pend.d)) {
                const pts = d.type === 'r' ? [[g.x1, g.y1], [g.x2, g.y2], [g.x1, g.y2], [g.x2, g.y1]] : [[g.x1, g.y1], [g.x2, g.y2]];
                ctx.fillStyle = trDark() ? '#111827' : '#fff'; ctx.lineWidth = 1.5;
                for (const [px, py] of pts) { ctx.beginPath(); ctx.rect(px - 3.5, py - 3.5, 7, 7); ctx.fill(); ctx.stroke(); }
            }
        }
    }

    // Lightweight Charts seri primitifi: grafik her boyandiginda (kaydirma, olcek) cizimleri yeniden cizer
    function DrawLayer(cell) {
        this.cell = cell;
        this.req = null;
        this.axis = [];
        const self = this;
        this.views = [{ zOrder: () => 'top', renderer: () => ({
            draw: target => target.useMediaCoordinateSpace(({ context, mediaSize }) => paintCell(self.cell, context, mediaSize)),
        }) }];
    }
    DrawLayer.prototype.attached = function (p) { this.req = p.requestUpdate; };
    DrawLayer.prototype.detached = function () { this.req = null; };
    DrawLayer.prototype.paneViews = function () { return this.views; };
    DrawLayer.prototype.priceAxisViews = function () { return this.axis; };
    DrawLayer.prototype.updateAllViews = function () {
        // yatay cizgilerin fiyat ekseni etiketi
        const cell = this.cell;
        this.axis = listFor(cell.conf.symbol).filter(d => d.type === 'h').map(d => ({
            coordinate: () => { const y = cell.series.priceToCoordinate(d.a.p); return y == null ? -100 : y; },
            text: () => Number(d.a.p).toFixed(cell.precision),
            textColor: () => '#fff', backColor: () => d.c,
        }));
    };
    DrawLayer.prototype.hitTest = function (x, y) {
        if (draw.tool !== 'cursor') return null;
        const h = hitTest(this.cell, x, y);
        if (!h) return null;
        const cur = h.part === 'body' ? 'move' : h.part === 'a' || h.part === 'b' ? (h.d.type === 't' ? 'pointer' : 'nwse-resize') : 'nesw-resize';
        return { cursorStyle: cur, externalId: 'drawing', zOrder: 'top' };
    };
    DrawLayer.prototype.update = function () { this.updateAllViews(); if (this.req) this.req(); };

    function refreshClr(cell) {
        const n = listFor(cell.conf.symbol).length;
        cell.clr.textContent = `${n} drawing${n === 1 ? '' : 's'} ✕`;
        cell.clr.style.display = n && window.innerWidth >= 768 ? 'inline-block' : 'none';
    }

    function finishPending() {
        const pend = draw.pending;
        draw.pending = null;
        if (!pend) return;
        const d = pend.d;
        if (d.type !== 'h' && Math.abs(d.a.t - d.b.t) < 1 && Math.abs(d.a.p - d.b.p) < 1e-12) { redrawSymbol(pend.sym); return; }   // bos cizim
        (drawings[pend.sym] = drawings[pend.sym] || []).push(d);
        saveDrawings();
        draw.selected = { sym: pend.sym, d };
        setTool('cursor');
        redrawSymbol(pend.sym);
    }

    function onDown(cell, e) {
        if (e.button !== 0 || window.innerWidth < 768) return;
        const pos = paneXY(cell, e);
        if (!pos.inside) return;
        const sym = cell.conf.symbol;
        if (draw.tool === 'cursor') {
            const h = hitTest(cell, pos.x, pos.y);
            const prev = draw.selected;
            if (!h) {
                if (prev) { draw.selected = null; redrawSymbol(prev.sym); }
                return;   // grafik kaydirma normal calissin
            }
            e.stopPropagation(); e.preventDefault();
            draw.selected = { sym, d: h.d };
            if (prev && prev.sym !== sym) redrawSymbol(prev.sym);
            const l0 = cell.chart.timeScale().coordinateToLogical(pos.x), p0 = cell.series.coordinateToPrice(pos.y);
            draw.drag = { cell, d: h.d, part: h.part, l0, p0, orig: JSON.parse(JSON.stringify(h.d)), moved: false };
            redrawSymbol(sym);
            return;
        }
        e.stopPropagation(); e.preventDefault();
        const pt = pointAt(cell, pos.x, pos.y);
        if (!pt) return;
        if (draw.tool === 'h') {
            draw.pending = { sym, cell, d: { id: Date.now(), type: 'h', a: pt, c: draw.color } };
            draw.pending.d.b = pt;
            finishPending();
            return;
        }
        if (draw.pending && draw.pending.sym !== sym) { const s = draw.pending.sym; draw.pending = null; redrawSymbol(s); }
        if (draw.pending) { draw.pending.d.b = pt; finishPending(); return; }
        draw.pending = { sym, cell, x0: e.clientX, y0: e.clientY, down: true,
                         d: { id: Date.now(), type: draw.tool, a: pt, b: { t: pt.t, p: pt.p }, c: draw.color } };
        redrawSymbol(sym);
    }

    window.addEventListener('mousemove', e => {
        const pend = draw.pending, drag = draw.drag;
        if (pend) {
            const pos = paneXY(pend.cell, e);
            const pt = pointAt(pend.cell, pos.x, pos.y);
            if (pt) { pend.d.b = pt; redrawSymbol(pend.sym); }
            return;
        }
        if (!drag) return;
        const cell = drag.cell, pos = paneXY(cell, e);
        const l = cell.chart.timeScale().coordinateToLogical(pos.x), p = cell.series.coordinateToPrice(pos.y);
        if (l == null || p == null || drag.l0 == null || drag.p0 == null) return;
        const d = drag.d, o = drag.orig, dl = l - drag.l0, dp = p - drag.p0;
        const shift = pt => ({ t: logicalToTime(cell, timeToLogical(cell, pt.t) + dl), p: pt.p + dp });
        const at = { t: logicalToTime(cell, l), p };
        if (drag.part === 'body') {
            if (d.type === 'h') { d.a.p = o.a.p + dp; d.b = d.a; }
            else { d.a = shift(o.a); d.b = shift(o.b); }
        } else if (drag.part === 'a') d.a = at;
        else if (drag.part === 'b') d.b = at;
        else if (drag.part === 'ab') { d.a = { t: at.t, p: o.a.p }; d.b = { t: o.b.t, p: at.p }; }
        else if (drag.part === 'ba') { d.b = { t: at.t, p: o.b.p }; d.a = { t: o.a.t, p: at.p }; }
        drag.moved = true;
        redrawSymbol(cell.conf.symbol);
    });
    window.addEventListener('mouseup', e => {
        const pend = draw.pending;
        // surukleyerek cizim: birakinca biter; yerinde tiklama ise ikinci tiklamayi bekler
        if (pend && pend.down) {
            pend.down = false;
            if (Math.hypot(e.clientX - pend.x0, e.clientY - pend.y0) > 5) finishPending();
        }
        if (draw.drag) {
            if (draw.drag.moved) saveDrawings();
            draw.drag = null;
        }
    });

    function deleteSelected() {
        const s = draw.selected;
        if (!s) return;
        drawings[s.sym] = listFor(s.sym).filter(d => d !== s.d);
        if (!drawings[s.sym].length) delete drawings[s.sym];
        draw.selected = null;
        saveDrawings();
        redrawSymbol(s.sym);
    }
    document.addEventListener('keydown', e => {
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
        if (e.key === 'Escape') {
            const syms = new Set([draw.pending && draw.pending.sym, draw.selected && draw.selected.sym]);
            draw.pending = null; draw.selected = null; setTool('cursor');
            syms.forEach(s => s && redrawSymbol(s));
        } else if ((e.key === 'Delete' || e.key === 'Backspace') && draw.selected) {
            e.preventDefault(); deleteSelected();
        }
    });

    const drawBar = document.getElementById('draw-bar');
    function setTool(t) {
        draw.tool = t;
        if (t !== 'cursor' && draw.pending && draw.pending.d.type !== t) { const s = draw.pending.sym; draw.pending = null; redrawSymbol(s); }
        drawBar.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
    }
    drawBar.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
    document.getElementById('draw-del').addEventListener('click', deleteSelected);
    const colorBox = document.getElementById('draw-colors');
    DCOLORS.forEach(c => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'ch-sw'; b.style.background = c; b.title = 'Drawing color';
        b.addEventListener('click', () => {
            draw.color = c;
            colorBox.querySelectorAll('.ch-sw').forEach(x => x.classList.toggle('on', x === b));
            if (draw.selected) { draw.selected.d.c = c; saveDrawings(); redrawSymbol(draw.selected.sym); }
        });
        colorBox.appendChild(b);
    });
    colorBox.firstElementChild.classList.add('on');
    setTool('cursor');

    function attachDrawing(cell) {
        cell.canvasEl = cell.el.querySelector('.ch-canvas');
        cell.clr = cell.el.querySelector('.ch-clr');
        cell.layer = new DrawLayer(cell);
        cell.series.attachPrimitive(cell.layer);
        // yakalama asamasinda: cizime/cizim aracina denk gelen tiklama grafigin kaydirmasina gitmesin
        cell.canvasEl.addEventListener('mousedown', e => onDown(cell, e), true);
        cell.clr.addEventListener('click', () => {
            const sym = cell.conf.symbol, n = listFor(sym).length;
            if (!n || !confirm(`Delete all ${n} drawing(s) on ${sym}?`)) return;
            delete drawings[sym];
            if (draw.selected && draw.selected.sym === sym) draw.selected = null;
            saveDrawings();
            redrawSymbol(sym);
        });
        refreshClr(cell);
    }

    // ── yerlesim ──
    function cellHeight(n) {
        if (window.innerWidth < 768) return 380;   // telefon: tek sutun, alt alta
        const rows = Math.ceil(n / (COLS[n] || 2));
        return Math.max(260, Math.floor((window.innerHeight - 90 - 8 * (rows - 1)) / rows));
    }
    function build() {
        cells.forEach(c => c.chart.remove());
        cells = [];
        draw.pending = null; draw.drag = null;
        grid.innerHTML = '';
        const n = state.layout in COLS ? state.layout : 4;
        grid.style.gridTemplateColumns = `repeat(${COLS[n]}, minmax(0, 1fr))`;
        const h = cellHeight(n);
        for (let i = 0; i < n; i++) {
            const cell = makeCell(i, h);
            cells.push(cell);
            load(cell, true);
        }
        document.querySelectorAll('#layouts .ch-lay').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
        requestAnimationFrame(fitAll);
    }

    function fitAll() {
        // autoSize'in ResizeObserver'i bazi tarayicilarda gec tetikleniyor: boyutu elle de ver
        cells.forEach(c => {
            const body = c.el.querySelector('.ch-body');
            if (body.clientWidth && body.clientHeight) c.chart.resize(body.clientWidth, body.clientHeight);
        });
    }

    document.querySelectorAll('#layouts .ch-lay').forEach(b => b.addEventListener('click', () => {
        state.layout = +b.dataset.n; save(); build();
    }));

    function setSwitch() {
        sw.classList.toggle('on', !!state.signals);
        sw.setAttribute('aria-checked', state.signals ? 'true' : 'false');
    }
    function toggleSignals() {
        state.signals = !state.signals; save(); setSwitch();
        cells.forEach(c => state.signals ? loadSignals(c) : clearSignals(c));
    }
    sw.addEventListener('click', toggleSignals);
    sw.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleSignals(); } });

    let resizeT;
    window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => {
        const h = cellHeight(cells.length);
        cells.forEach(c => c.el.style.height = h + 'px');
        requestAnimationFrame(fitAll);
    }, 150); });

    setSwitch();
    build();
    setInterval(() => { if (!document.hidden) cells.forEach(c => load(c, c.history === 'pending')); }, REFRESH_MS);
    setInterval(() => { if (!document.hidden && state.signals) cells.forEach(c => loadSignals(c)); }, SIGNAL_REFRESH_MS);
})();
</script>
