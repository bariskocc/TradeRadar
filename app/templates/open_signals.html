{% extends "base.html" %}

{% block title %}TradeRadar - Open Signals{% endblock %}

{% block body %}
<div class="flex h-full">

    {% include 'sidebar.html' %}

    <!-- Main Content -->
    <main class="flex-1 overflow-auto">
        <div class="p-6">
            <!-- Header -->
            <div class="mb-6 flex items-start justify-between">
                <div>
                    <h1 class="text-xl font-bold text-white">Open Signals</h1>
                    <p class="text-sm text-gray-500 mt-0.5">Active and waiting signals across all strategies</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Page refresh</p>
                    <p id="refresh-info" class="text-xs text-gray-400">Auto every 30s</p>
                </div>
            </div>

            <div id="open-board">
                {% include 'open_signals_table.html' %}
            </div>
        </div>
    </main>
</div>

<script>
// Sekme/TF gecisi ve 30 sn'de bir yenileme: sunucu ayni tablo parcasini (open_signals_table.html) yeniden uretir.
const openState = { tab: "{{ tab }}", tf: "{{ tf }}" };

async function loadOpenSignals() {
    try {
        const res = await fetch(`/open-signals/table?tab=${encodeURIComponent(openState.tab)}&tf=${encodeURIComponent(openState.tf)}`);
        if (!res.ok || res.redirected) return;
        document.getElementById('open-board').innerHTML = await res.text();
        document.getElementById('refresh-info').textContent =
            'Updated ' + new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch (e) {
        document.getElementById('refresh-info').textContent = 'Refresh failed';
    }
}

document.addEventListener('click', (e) => {
    const link = e.target.closest('#open-board [data-tab], #open-board [data-tf]');
    if (!link) return;
    e.preventDefault();
    if (link.dataset.tab) openState.tab = link.dataset.tab;
    if (link.dataset.tf) openState.tf = link.dataset.tf;
    history.replaceState(null, '', `/open-signals?tab=${openState.tab}&tf=${openState.tf}`);
    loadOpenSignals();
});

setInterval(loadOpenSignals, 30000);
</script>
{% endblock %}
